<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#090909">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Car Thing</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #090909;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

button {
    border: 0;
    color: white;
    background: transparent;
    cursor: pointer;
}

#app {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* ---------------- TOP BAR ---------------- */

.topbar {
    height: 58px;
    min-height: 58px;
    display: flex;
    align-items: center;
    padding: 0 22px;
    background: #111;
    border-bottom: 1px solid #242424;
}

.logo {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: 1px;
}

.logo span {
    color: #1ed760;
}

.connection {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 14px;
    color: #aaa;
}

.dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #777;
}

.dot.online {
    background: #1ed760;
    box-shadow: 0 0 10px #1ed760;
}

.dot.error {
    background: #e74c3c;
}

/* ---------------- MAIN ---------------- */

.main {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(220px, 34%) 1fr 150px;
    gap: 26px;
    padding: 26px;
}

/* ---------------- ART ---------------- */

.art-area {
    display: flex;
    align-items: center;
    justify-content: center;
}

.album-art {
    width: min(34vw, 48vh);
    height: min(34vw, 48vh);
    max-width: 430px;
    max-height: 430px;
    min-width: 190px;
    min-height: 190px;

    background:
        linear-gradient(135deg, #202020, #101010);

    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 15px 45px rgba(0,0,0,.55);
}

.album-art img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.album-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 70px;
    color: #555;
}

/* ---------------- CENTER ---------------- */

.center {
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.track-title {
    font-size: clamp(26px, 4vw, 50px);
    font-weight: 800;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.track-artist {
    margin-top: 8px;
    font-size: clamp(17px, 2vw, 25px);
    color: #a7a7a7;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.album-name {
    margin-top: 5px;
    color: #686868;
    font-size: 15px;
}

/* ---------------- PROGRESS ---------------- */

.progress-area {
    margin-top: 36px;
}

.progress {
    width: 100%;
    height: 7px;
    appearance: none;
    background: #3b3b3b;
    border-radius: 10px;
    outline: none;
}

.progress::-webkit-slider-thumb {
    appearance: none;
    width: 18px;
    height: 18px;
    background: #fff;
    border-radius: 50%;
}

.progress::-moz-range-thumb {
    width: 18px;
    height: 18px;
    background: #fff;
    border: 0;
    border-radius: 50%;
}

.times {
    margin-top: 7px;
    display: flex;
    justify-content: space-between;
    color: #777;
    font-size: 13px;
}

/* ---------------- CONTROLS ---------------- */

.controls {
    margin-top: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(12px, 2vw, 28px);
}

.control {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    background: #191919;
    transition: transform .1s, background .1s;
}

.control:active {
    transform: scale(.9);
    background: #292929;
}

.control.main-control {
    width: 78px;
    height: 78px;
    background: #fff;
    color: #000;
    font-size: 31px;
}

.control.active {
    color: #1ed760;
}

/* ---------------- RIGHT PANEL ---------------- */

.right {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
}

.volume-label {
    color: #777;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.volume-wheel {
    position: relative;
    width: 112px;
    height: 112px;
    border-radius: 50%;

    background:
        conic-gradient(
            #1ed760 0deg,
            #1ed760 var(--volume),
            #333 var(--volume),
            #333 360deg
        );

    display: flex;
    align-items: center;
    justify-content: center;
}

.volume-wheel::before {
    content: "";
    position: absolute;
    width: 82px;
    height: 82px;
    border-radius: 50%;
    background: #111;
}

.volume-value {
    position: relative;
    z-index: 2;
    font-size: 19px;
    font-weight: bold;
}

.vol-buttons {
    display: flex;
    gap: 10px;
}

.small-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #191919;
    font-size: 20px;
}

/* ---------------- BOTTOM ---------------- */

.bottom {
    height: 60px;
    min-height: 60px;
    border-top: 1px solid #242424;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
}

.bottom button {
    min-width: 110px;
    padding: 11px 18px;
    border-radius: 8px;
    background: #1b1b1b;
    color: #aaa;
    font-size: 14px;
}

.bottom button.active {
    color: #1ed760;
}

/* ---------------- DRAWERS ---------------- */

.drawer {
    position: fixed;
    top: 0;
    right: -420px;
    width: min(420px, 90vw);
    height: 100vh;
    background: #121212;
    z-index: 20;
    box-shadow: -20px 0 50px rgba(0,0,0,.5);
    transition: right .25s ease;
    display: flex;
    flex-direction: column;
}

.drawer.open {
    right: 0;
}

.drawer-header {
    height: 65px;
    min-height: 65px;
    display: flex;
    align-items: center;
    padding: 0 20px;
    border-bottom: 1px solid #292929;
}

.drawer-title {
    font-size: 20px;
    font-weight: bold;
}

.close {
    margin-left: auto;
    font-size: 26px;
}

.drawer-content {
    padding: 20px;
    overflow-y: auto;
}

.info {
    color: #888;
    line-height: 1.5;
}

.queue-item {
    display: flex;
    gap: 12px;
    padding: 13px 0;
    border-bottom: 1px solid #222;
}

.queue-number {
    color: #555;
    width: 25px;
}

.queue-title {
    font-weight: bold;
}

.queue-artist {
    color: #777;
    margin-top: 3px;
}

/* ---------------- OVERLAY ---------------- */

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    z-index: 15;
    display: none;
}

.overlay.show {
    display: block;
}

/* ---------------- MOBILE ---------------- */

@media (max-width: 800px) {
    .main {
        grid-template-columns: 1fr 100px;
        gap: 15px;
        padding: 15px;
    }

    .art-area {
        display: none;
    }

    .right {
        gap: 12px;
    }

    .volume-wheel {
        width: 90px;
        height: 90px;
    }

    .volume-wheel::before {
        width: 66px;
        height: 66px;
    }

    .controls {
        gap: 9px;
    }

    .control {
        width: 48px;
        height: 48px;
    }

    .control.main-control {
        width: 64px;
        height: 64px;
    }
}
</style>
</head>

<body>

<div id="app">

    <div class="topbar">

        <div class="logo">
            CAR<span>THING</span>
        </div>

        <div class="connection">
            <div id="connectionDot" class="dot"></div>
            <span id="connectionText">Connecting...</span>
        </div>

    </div>


    <main class="main">

        <!-- ALBUM ART -->

        <section class="art-area">

            <div class="album-art">

                <img id="albumArt"
                     style="display:none"
                     alt="Album artwork">

                <div id="albumPlaceholder"
                     class="album-placeholder">
                    ♪
                </div>

            </div>

        </section>


        <!-- CENTER -->

        <section class="center">

            <div id="trackTitle"
                 class="track-title">
                Nothing Playing
            </div>

            <div id="trackArtist"
                 class="track-artist">
                —
            </div>

            <div id="albumName"
                 class="album-name">
                —
            </div>


            <div class="progress-area">

                <input
                    id="progress"
                    class="progress"
                    type="range"
                    min="0"
                    max="100"
                    value="0"
                    step="0.1">

                <div class="times">

                    <span id="currentTime">
                        0:00
                    </span>

                    <span id="duration">
                        0:00
                    </span>

                </div>

            </div>


            <div class="controls">

                <button
                    id="shuffleButton"
                    class="control"
                    onclick="toggleShuffle()">
                    🔀
                </button>

                <button
                    class="control"
                    onclick="previousTrack()">
                    ⏮
                </button>

                <button
                    id="playButton"
                    class="control main-control"
                    onclick="playPause()">
                    ▶
                </button>

                <button
                    class="control"
                    onclick="nextTrack()">
                    ⏭
                </button>

                <button
                    id="repeatButton"
                    class="control"
                    onclick="cycleRepeat()">
                    🔁
                </button>

            </div>

        </section>


        <!-- VOLUME -->

        <section class="right">

            <div class="volume-label">
                Volume
            </div>

            <div
                id="volumeWheel"
                class="volume-wheel"
                style="--volume: 0deg">

                <div id="volumeValue"
                     class="volume-value">
                    0%
                </div>

            </div>

            <div class="vol-buttons">

                <button
                    class="small-btn"
                    onclick="changeVolume(-5)">
                    −
                </button>

                <button
                    class="small-btn"
                    onclick="changeVolume(5)">
                    +
                </button>

            </div>

        </section>

    </main>


    <footer class="bottom">

        <button onclick="openDrawer('queue')">
            ☰ Queue
        </button>

        <button onclick="openDrawer('settings')">
            ⚙ Settings
        </button>

    </footer>

</div>


<!-- OVERLAY -->

<div id="overlay"
     class="overlay"
     onclick="closeDrawers()">
</div>


<!-- QUEUE -->

<div id="queueDrawer"
     class="drawer">

    <div class="drawer-header">

        <div class="drawer-title">
            Queue
        </div>

        <button
            class="close"
            onclick="closeDrawers()">
            ×
        </button>

    </div>

    <div id="queueContent"
         class="drawer-content">

        <div class="info">
            Queue information isn't exposed by the
            basic Linux MPRIS interface.
        </div>

    </div>

</div>


<!-- SETTINGS -->

<div id="settingsDrawer"
     class="drawer">

    <div class="drawer-header">

        <div class="drawer-title">
            Settings
        </div>

        <button
            class="close"
            onclick="closeDrawers()">
            ×
        </button>

    </div>

    <div class="drawer-content">

        <p class="info">
            Linux Car Thing controller
        </p>

        <p class="info">
            Controller:
            <br>
            Python + Flask
        </p>

        <p class="info">
            Playback:
            <br>
            Spotify + MPRIS
        </p>

        <p class="info">
            No Spotify Web API authentication
            is used.
        </p>

        <button
            onclick="testConnection()"
            style="
                width:100%;
                padding:15px;
                background:#1ed760;
                color:#000;
                border-radius:8px;
                font-weight:bold;
            ">
            Test Connection
        </button>

    </div>

</div>


<script>

/*
====================================================
 CONFIGURATION
====================================================

CHANGE THIS TO YOUR LINUX PC'S IP ADDRESS.

Run on Linux:

    hostname -I

Example:

    192.168.1.123

Then use:

    http://192.168.1.123:8081
*/

const PC = "http://192.168.0.218:8081";


/*
====================================================
 STATE
====================================================
*/

let state = {
    connected: false,
    playing: false,
    duration: 0,
    position: 0,
    volume: 0,
    shuffle: false,
    repeat: "None"
};

let updatingProgress = false;


/*
====================================================
 API
====================================================
*/

async function api(endpoint, options = {}) {

    try {

        const response = await fetch(
            PC + endpoint,
            {
                ...options,
                headers: {
                    "Content-Type": "application/json",
                    ...(options.headers || {})
                }
            }
        );

        if (!response.ok) {
            throw new Error(
                `HTTP ${response.status}`
            );
        }

        return await response.json();

    } catch (error) {

        console.error(
            "Car Thing API error:",
            error
        );

        setConnection(false);

        return null;
    }
}


/*
====================================================
 CONNECTION
====================================================
*/

function setConnection(connected) {

    state.connected = connected;

    const dot =
        document.getElementById(
            "connectionDot"
        );

    const text =
        document.getElementById(
            "connectionText"
        );

    dot.classList.remove(
        "online",
        "error"
    );

    if (connected) {

        dot.classList.add("online");

        text.textContent =
            "Connected";

    } else {

        dot.classList.add("error");

        text.textContent =
            "PC Offline";
    }
}


/*
====================================================
 STATUS
====================================================
*/

async function updateStatus() {

    const data =
        await api("/status");

    if (!data) {
        return;
    }

    setConnection(true);

    state.playing =
        data.state === "Playing";

    state.duration =
        Number(data.length) || 0;

    state.position =
        Number(data.position) || 0;

    state.volume =
        Number(data.volume) || 0;


    document.getElementById(
        "trackTitle"
    ).textContent =
        data.title || "Nothing Playing";


    document.getElementById(
        "trackArtist"
    ).textContent =
        data.artist || "—";


    document.getElementById(
        "albumName"
    ).textContent =
        data.album || "—";


    /*
    Album artwork
    */

    const art =
        document.getElementById(
            "albumArt"
        );

    const placeholder =
        document.getElementById(
            "albumPlaceholder"
        );

    if (data.art) {

        art.src = data.art;

        art.style.display =
            "block";

        placeholder.style.display =
            "none";

    } else {

        art.style.display =
            "none";

        placeholder.style.display =
            "flex";
    }


    /*
    Play button
    */

    document.getElementById(
        "playButton"
    ).textContent =
        state.playing ? "❚❚" : "▶";


    /*
    Volume
    */

    updateVolumeUI(
        state.volume
    );


    /*
    Progress
    */

    if (!updatingProgress) {

        const progress =
            document.getElementById(
                "progress"
            );

        progress.max =
            state.duration || 100;

        progress.value =
            Math.min(
                state.position,
                state.duration || 100
            );

        document.getElementById(
            "currentTime"
        ).textContent =
            formatTime(state.position);

        document.getElementById(
            "duration"
        ).textContent =
            formatTime(state.duration);
    }
}


/*
====================================================
 PLAYBACK
====================================================
*/

async function playPause() {

    await api(
        "/playpause",
        {
            method: "POST"
        }
    );

    setTimeout(
        updateStatus,
        150
    );
}


async function nextTrack() {

    await api(
        "/next",
        {
            method: "POST"
        }
    );

    setTimeout(
        updateStatus,
        500
    );
}


async function previousTrack() {

    await api(
        "/previous",
        {
            method: "POST"
        }
    );

    setTimeout(
        updateStatus,
        500
    );
}


/*
====================================================
 SEEK
====================================================
*/

const progress =
    document.getElementById(
        "progress"
    );


progress.addEventListener(
    "input",
    () => {

        updatingProgress = true;

        const position =
            Number(progress.value);

        document.getElementById(
            "currentTime"
        ).textContent =
            formatTime(position);
    }
);


progress.addEventListener(
    "change",
    async () => {

        const position =
            Number(progress.value);

        await api(
            "/seek",
            {
                method: "POST",
                body: JSON.stringify({
                    position
                })
            }
        );

        updatingProgress = false;
    }
);


/*
====================================================
 VOLUME
====================================================
*/

async function setVolume(value) {

    value =
        Math.max(
            0,
            Math.min(
                100,
                value
            )
        );

    await api(
        "/volume",
        {
            method: "POST",
            body: JSON.stringify({
                volume: value
            })
        }
    );

    updateVolumeUI(value);
}


async function changeVolume(amount) {

    await setVolume(
        state.volume + amount
    );
}


function updateVolumeUI(value) {

    state.volume =
        Math.max(
            0,
            Math.min(
                100,
                value
            )
        );

    const degrees =
        state.volume * 3.6;

    document.getElementById(
        "volumeWheel"
    ).style.setProperty(
        "--volume",
        degrees + "deg"
    );

    document.getElementById(
        "volumeValue"
    ).textContent =
        Math.round(state.volume) + "%";
}


/*
====================================================
 VOLUME WHEEL TOUCH / MOUSE
====================================================
*/

const wheel =
    document.getElementById(
        "volumeWheel"
    );

let wheelDragging = false;


function volumeFromPointer(event) {

    const rect =
        wheel.getBoundingClientRect();

    const centerX =
        rect.left +
        rect.width / 2;

    const centerY =
        rect.top +
        rect.height / 2;

    const x =
        event.clientX -
        centerX;

    const y =
        event.clientY -
        centerY;

    let angle =
        Math.atan2(
            y,
            x
        ) *
        180 /
        Math.PI;

    angle += 90;

    if (angle < 0) {
        angle += 360;
    }

    let value =
        (angle / 360) * 100;

    value =
        Math.max(
            0,
            Math.min(
                100,
                value
            )
        );

    setVolume(value);
}


wheel.addEventListener(
    "pointerdown",
    event => {

        wheelDragging = true;

        wheel.setPointerCapture(
            event.pointerId
        );

        volumeFromPointer(event);
    }
);


wheel.addEventListener(
    "pointermove",
    event => {

        if (!wheelDragging) {
            return;
        }

        volumeFromPointer(event);
    }
);


wheel.addEventListener(
    "pointerup",
    () => {

        wheelDragging = false;
    }
);


/*
====================================================
 SHUFFLE
====================================================
*/

async function toggleShuffle() {

    state.shuffle =
        !state.shuffle;

    await api(
        "/shuffle",
        {
            method: "POST",
            body: JSON.stringify({
                enabled:
                    state.shuffle
            })
        }
    );

    document
        .getElementById(
            "shuffleButton"
        )
        .classList.toggle(
            "active",
            state.shuffle
        );
}


/*
====================================================
 REPEAT
====================================================
*/

async function cycleRepeat() {

    const modes = [
        "None",
        "Track",
        "Playlist"
    ];

    let index =
        modes.indexOf(
            state.repeat
        );

    index =
        (index + 1) %
        modes.length;

    state.repeat =
        modes[index];

    await api(
        "/repeat",
        {
            method: "POST",
            body: JSON.stringify({
                mode:
                    state.repeat
            })
        }
    );

    const button =
        document.getElementById(
            "repeatButton"
        );

    button.classList.toggle(
        "active",
        state.repeat !== "None"
    );

    if (state.repeat === "Track") {
        button.textContent = "🔂";
    } else {
        button.textContent = "🔁";
    }
}


/*
====================================================
 DRAWERS
====================================================
*/

function openDrawer(name) {

    closeDrawers();

    document
        .getElementById(
            name + "Drawer"
        )
        .classList.add("open");

    document
        .getElementById(
            "overlay"
        )
        .classList.add("show");
}


function closeDrawers() {

    document
        .querySelectorAll(".drawer")
        .forEach(
            drawer =>
                drawer.classList.remove(
                    "open"
                )
        );

    document
        .getElementById(
            "overlay"
        )
        .classList.remove(
            "show"
        );
}


/*
====================================================
 TEST
====================================================
*/

async function testConnection() {

    const data =
        await api("/status");

    if (data) {

        alert(
            "Connected to Linux PC!\n\n" +
            "Spotify: " +
            (data.player || "Not detected")
        );

    } else {

        alert(
            "Could not connect to the Linux PC."
        );
    }
}


/*
====================================================
 TIME
====================================================
*/

function formatTime(seconds) {

    if (
        !Number.isFinite(seconds) ||
        seconds < 0
    ) {
        return "0:00";
    }

    seconds =
        Math.floor(seconds);

    const minutes =
        Math.floor(
            seconds / 60
        );

    const secs =
        seconds % 60;

    return (
        minutes +
        ":" +
        String(secs).padStart(
            2,
            "0"
        )
    );
}


/*
====================================================
 LOCAL PROGRESS TICK
====================================================
*/

setInterval(
    () => {

        if (
            state.playing &&
            state.duration > 0 &&
            !updatingProgress
        ) {

            state.position += 0.25;

            if (
                state.position >
                state.duration
            ) {
                state.position =
                    state.duration;
            }

            document.getElementById(
                "progress"
            ).value =
                state.position;

            document.getElementById(
                "currentTime"
            ).textContent =
                formatTime(
                    state.position
                );
        }

    },
    250
);
